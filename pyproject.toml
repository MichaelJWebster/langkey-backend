[project]
name = "langkey-backend"
version = "0.1.0"
description = "LangKey language-learning backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "fsrs>=6.3.2",
    "alembic>=1.20.0",
    "duckdb>=1.5.5",
    "boto3>=1.43.103",
    "python-multipart>=0.0.32",
    "httpx>=0.27",
]

[dependency-groups]
# Only the speech container installs these: torch and transformers are several
# gigabytes and have no business in the API image (ADR-032).
speech = [
    "torch>=2.5",
    "transformers>=4.45",
    # PyAV, not librosa: librosa 1.0 reads through soundfile alone, which
    # cannot open the webm/opus the browser records. PyAV bundles the ffmpeg
    # libraries, so neither the Mac nor the image needs a system ffmpeg.
    "av>=14",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "numpy>=2.5.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
